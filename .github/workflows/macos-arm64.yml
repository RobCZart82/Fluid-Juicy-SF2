name: Native Apple Silicon
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require a native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build pinned sources and run processor regressions
        run: python3 scripts/build.py --arch arm64 --jobs 3
      - name: Verify architecture and package development artifact
        run: python3 scripts/package_macos.py
      - name: Verify exported sources without Git metadata
        run: python3 scripts/check_source_bundle.py build/arm64/distribution/corresponding-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fluid-juicy-sf2-macos-arm64-development
          path: build/arm64/distribution/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostic logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-diagnostics
          path: |
            build/arm64/**/CMakeConfigureLog.yaml
            build/arm64/plugin/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
