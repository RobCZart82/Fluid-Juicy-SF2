name: Intel and Windows validation
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: desktop-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: src
      - name: Build pinned sources and run processor regressions
        working-directory: src
        run: python3 scripts/build.py --arch x86_64 --jobs 3 --build-dir "${{ runner.temp }}/fj"
      - name: Verify and package development build
        working-directory: src
        run: python3 scripts/package_desktop.py --arch x86_64 --build-dir "${{ runner.temp }}/fj"
      - name: Verify exported sources without Git metadata
        working-directory: src
        run: python3 scripts/check_source_bundle.py "${{ runner.temp }}/fj/x86_64/distribution/corresponding-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluid-juicy-sf2-${{ matrix.os }}-x86_64-development
          path: ${{ runner.temp }}/fj/x86_64/distribution/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostic logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.os }}-diagnostics
          path: |
            ${{ runner.temp }}/fj/x86_64/**/CMakeConfigureLog.yaml
            ${{ runner.temp }}/fj/x86_64/plugin/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
